<title>Trénink</title>
<style>
  :root{
    --bg:#0F1218;
    --surface:#181D26;
    --elevated:#222937;
    --line:#2B3342;
    --text:#EEF1F6;
    --muted:#8B93A5;
    --accent:#FF7A3D;
    --accent-soft:rgba(255,122,61,.14);
    --done:#3DDC97;
    --done-soft:rgba(61,220,151,.13);
    --danger:#FF5470;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit}

  #app{
    max-width:520px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }

  /* ---------- header ---------- */
  header{
    padding:22px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .h-title{display:flex;flex-direction:column;gap:2px}
  .h-eyebrow{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  }
  .h-day{font-size:26px;font-weight:800;letter-spacing:-.01em}
  .h-right{display:flex;align-items:center;gap:10px;flex:none}
  .streak{
    display:flex;align-items:center;gap:5px;
    background:var(--elevated);border:1px solid var(--line);border-radius:999px;
    padding:9px 13px;font-size:14px;font-weight:800;color:var(--muted);
  }
  .streak.hot{background:var(--accent-soft);border-color:rgba(255,122,61,.45);color:var(--accent)}
  .ring{position:relative;width:58px;height:58px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5}
  .ring .bgc{stroke:var(--elevated)}
  .ring .fgc{stroke:var(--done);stroke-linecap:round;transition:stroke-dashoffset .45s ease}
  .ring span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;
  }

  main{flex:1;padding:0 16px}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .card.done-card{border-color:rgba(61,220,151,.35);background:linear-gradient(180deg,var(--done-soft),var(--surface) 70%)}
  .ex-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .ex-name{font-size:17px;font-weight:700}
  .ex-count{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .ex-count b{color:var(--text)}
  .ex-note{font-size:13.5px;color:var(--muted);margin-bottom:12px}

  /* set circles — the heart of the app */
  .sets{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .set{
    width:48px;height:48px;border-radius:50%;
    border:2.5px solid var(--line);
    background:var(--elevated);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:var(--muted);
    transition:transform .12s ease,background .18s,border-color .18s,color .18s;
    user-select:none;-webkit-user-select:none;
  }
  .set:active{transform:scale(.88)}
  .set.on{
    background:var(--done);border-color:var(--done);color:#07130D;
    animation:pop .28s ease;
  }
  .set.on::after{content:"✓";font-size:19px;font-weight:900}
  .set.on span{display:none}
  @keyframes pop{
    0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}
  }

  /* ---------- empty states ---------- */
  .empty{
    text-align:center;padding:52px 24px;color:var(--muted);
  }
  .empty .big{font-size:40px;margin-bottom:12px}
  .empty h3{color:var(--text);font-size:17px;margin-bottom:6px}
  .empty p{font-size:14px;line-height:1.5}

  /* ---------- section head ---------- */
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 4px 14px;
  }
  .sec-head h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .add-btn{
    background:var(--accent);color:#1A0E05;font-weight:800;font-size:14px;
    padding:10px 16px;border-radius:999px;
    display:flex;align-items:center;gap:6px;
    transition:transform .12s ease;
  }
  .add-btn:active{transform:scale(.94)}

  /* ---------- list rows ---------- */
  .row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .row-info{min-width:0}
  .row-name{font-size:16px;font-weight:700;margin-bottom:3px}
  .row-name:last-child{margin-bottom:0}
  .row-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .row-actions{display:flex;gap:6px;flex:none}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;background:var(--elevated);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:transform .12s ease;
  }
  .icon-btn:active{transform:scale(.9)}

function todayStr(){ return dateStr(new Date()); }

function seedCatalog(s){
  const names = new Set(s.exercises.map(e => e.name.toLowerCase()));
  for(const g of Object.keys(CATALOG)){
    for(const name of CATALOG[g]){
      if(!names.has(name.toLowerCase())){
        s.exercises.push({ id: uid(), name, group: g });
      }
    }
  }
  s.seeded = true;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.exercises) && Array.isArray(s.plans)){
        if(s.activePlanId === undefined) s.activePlanId = null;
        if(!Array.isArray(s.completedDays)) s.completedDays = [];
        if(s.daily && s.daily.manualPlanId === undefined) s.daily.manualPlanId = null;
        if(s.daily && s.daily.manualDay === undefined) s.daily.manualDay = null;
        if(!s.settings) s.settings = { restTimer: 90 };
        if(s.settings.restTimer === undefined) s.settings.restTimer = 90;
        if(s.settings.waterGoal === undefined) s.settings.waterGoal = 2000;
        if(!s.history || typeof s.history !== "object") s.history = {};
        if(!s.bodyWeight || typeof s.bodyWeight !== "object") s.bodyWeight = {};
        if(!s.water || typeof s.water !== "object") s.water = {};
        if(!s.sessions || typeof s.sessions !== "object") s.sessions = {};
        if(s.lastBackup === undefined) s.lastBackup = null;
        if(!s.deleted || typeof s.deleted !== "object") s.deleted = {};
        if(!s.updatedAt) s.updatedAt = Date.now();

        /* migrace 1: plán { days, exerciseIds } → { schedule } */
        for(const p of s.plans){
          if(!p.schedule){
            p.schedule = {};
            const days = Array.isArray(p.days) ? p.days : [];
            const ids = Array.isArray(p.exerciseIds) ? p.exerciseIds : [];
            for(const d of days) p.schedule[d] = [...ids];
            delete p.days; delete p.exerciseIds;
          }
        }
        /* migrace 2: schedule s prostými id → záznamy {exId, sets, weight, reps};
           série/váha/poznámka se přenesou z cviku do záznamů v plánu */
        for(const p of s.plans){
          for(const d in p.schedule){
            p.schedule[d] = p.schedule[d].map(item => {
              if(typeof item === "string"){
                const ex = s.exercises.find(e => e.id === item);
                return {
                  exId: item,
                  sets: ex && ex.sets ? ex.sets : 3,
                  weight: ex && ex.weight != null ? ex.weight : null,
                  reps: ex && ex.note ? String(ex.note).slice(0,20) : ""
                };
              }
              return item;
            });
          }
        }
        /* migrace 3: cvik už nenese série/váhu/poznámku, jen název a partii */
        for(const e of s.exercises){
          if(e.group === undefined) e.group = "Ostatní";
          delete e.sets; delete e.weight; delete e.note;
        }
        if(!s.seeded) seedCatalog(s);
        return s;
      }
    }
  }catch(e){}
  const s = { exercises:[], plans:[], activePlanId:null, completedDays:[], seeded:false,
              settings:{ restTimer: 90, waterGoal: 2000 }, history:{}, bodyWeight:{}, water:{},
              sessions:{}, lastBackup:null, deleted:{}, updatedAt:Date.now(),
              daily:{ date:todayStr(), progress:{}, manualPlanId:null, manualDay:null } };
  seedCatalog(s);
  return s;
}
function save(){
  if(!syncApplying) state.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(!syncApplying) schedulePush();
}
const touch = o => { if(o) o.upd = Date.now(); return o; };
function ensureToday(){
  if(!state.daily || state.daily.date !== todayStr()){
    state.daily = { date: todayStr(), progress:{}, manualPlanId:null, manualDay:null };
    save();
  }
}

/* zaznamená / odebere dnešek podle toho, zda je celý plán odcvičený */
function updateCompletedToday(total, done){
  if(total <= 0) return;
  const t = todayStr();
  const has = state.completedDays.includes(t);
  if(done === total && !has){ state.completedDays.push(t); save(); }
  if(done < total && has){ state.completedDays = state.completedDays.filter(x => x !== t); save(); }
}

/* počet odcvičených dnů v řadě (dnešek se počítá, jinak řada končící včerejškem) */
function computeStreak(){
  const set = new Set(state.completedDays);
  const d = new Date();
  if(!set.has(dateStr(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(set.has(dateStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ================= helpers ================= */
function exById(id){ return state.exercises.find(e => e.id === id); }
function entriesOf(p, d){
  return (p.schedule && p.schedule[d] ? p.schedule[d] : []).filter(en => exById(en.exId));
}
function todaysWorkout(){
  const dow = new Date().getDay();
  const manual = state.daily.manualPlanId ? state.plans.find(p => p.id === state.daily.manualPlanId) : null;
  const active = state.activePlanId ? state.plans.find(p => p.id === state.activePlanId) : null;

  let plan = null, mode = "none", day = dow;
  if(manual){ plan = manual; mode = "manual"; day = (state.daily.manualDay ?? dow); }
  else if(active && entriesOf(active, dow).length){ plan = active; mode = "active"; }
  else if(active){ mode = "rest"; }

  const entries = plan ? entriesOf(plan, day) : [];
  return { plan, mode, entries, day, dow };
}
function progressOf(entry){
  const arr = state.daily.progress[entry.exId] || [];
  let n = 0;
  for(let i=0;i<entry.sets;i++) if(arr[i]) n++;
  return n;
}
function plural(n,a,b,c){ return n===1?a : (n>=2&&n<=4?b:c); }
const fmtL = ml => (ml/1000).toLocaleString("cs-CZ", { maximumFractionDigits: 2 });


/* ---------- deník tréninků ---------- */
function sessionForToday(plan, day){
  const t = todayStr();
  let s = state.sessions[t];
  if(!s) s = state.sessions[t] = { planId: plan.id, planName: plan.name, day, ex: {} };
  else { s.planId = plan.id; s.planName = plan.name; s.day = day; }
  return s;
}
function recordSet(plan, day, en, i, on, custom){
  const s = sessionForToday(plan, day);
  const ex = exById(en.exId);
  let rec = s.ex[en.exId];
  if(!rec) rec = s.ex[en.exId] = { name: ex ? ex.name : "?", sets: [] };
  while(rec.sets.length < en.sets) rec.sets.push(null);
  if(on) rec.sets[i] = custom || rec.sets[i] || { w: en.weight, r: en.reps || "" };
  else rec.sets[i] = null;
  if(!rec.sets.some(Boolean)) delete s.ex[en.exId];
  if(!Object.keys(s.ex).length) delete state.sessions[t];
}
function setLogOf(exId, i){
  const s = state.sessions[todayStr()];
  return s && s.ex[exId] ? (s.ex[exId].sets[i] || null) : null;
}
function lastSessionFor(exId){
  const t = todayStr();
  const dates = Object.keys(state.sessions).filter(d => d < t).sort().reverse();
  for(const d of dates){
    const rec = state.sessions[d].ex[exId];
    if(rec){
      const done = rec.sets.filter(Boolean);
      if(done.length) return { date: d, sets: done };
    }
  }
  return null;
}
const numReps = r => { const m = String(r == null ? "" : r).match(/\d+/); return m ? +m[0] : 0; };
function summarizeSets(sets){
  const ws = sets.map(s => s.w);
  const rs = sets.map(s => s.r || "");
  const sameW = ws.every(w => w === ws[0]);
  const sameR = rs.every(r => r === rs[0]);
  const rPart = sameR ? (rs[0] ? "×" + rs[0] : "") : "×(" + rs.join("/") + ")";
  const wPart = sameW
    ? (ws[0] != null ? ws[0] + " kg" : "")
    : ws.map(w => w == null ? "–" : w).join("/") + " kg";
  return sets.length + rPart + (wPart ? " · " + wPart : "");
}
function volumeOfSets(sets){
  let v = 0;
  for(const s of sets) if(s && s.w != null) v += s.w * (numReps(s.r) || 1);
  return v;
}
function sessionVolume(sess){
  let v = 0;
  for(const id in sess.ex) v += volumeOfSets(sess.ex[id].sets.filter(Boolean));
  return v;
}
function best1RM(sets){
  let best = 0;
  for(const s of sets){
    if(!s || s.w == null) continue;
    const r = numReps(s.r) || 1;
    best = Math.max(best, s.w * (1 + r/30));
  }
  return best;
}
const fmtVol = v => v >= 1000 ? (v/1000).toFixed(1).replace(".", ",") + " t" : Math.round(v) + " kg";
const fmtShort = ds => { const p = ds.split("-"); return (+p[2])+"."+(+p[1])+"."; };

/* ---------- hydratace ---------- */
function waterBtnHTML(){
  const cur = state.water[todayStr()] || 0;
  const goal = state.settings.waterGoal;
  const pct = Math.min(100, Math.round(cur/goal*100));
  return `
    <button class="waterbtn ${cur >= goal ? "full" : ""}" id="waterBtn" title="Hydratace" aria-label="Hydratace">
      <div class="wfill" style="height:${pct}%"></div>
      <i>💧</i>
    </button>`;
}
function openWaterSheet(){
  const render2 = () => {
    const cur = state.water[todayStr()] || 0;
    const goal = state.settings.waterGoal;
    const pct = Math.min(100, Math.round(cur/goal*100));
    $sheet.innerHTML = `
      <div class="grabber"></div>
      <h3 style="margin-bottom:14px">💧 Hydratace</h3>
      <div class="w-amount">
        <div class="big2">${fmtL(cur)} l</div>
        <div class="sub3">z cíle ${fmtL(goal)} l ${cur >= goal ? "· splněno ✓" : `· zbývá ${fmtL(Math.max(0, goal-cur))} l`}</div>
      </div>
      <div class="hydro-bar"><div class="hydro-fill ${cur >= goal ? "full" : ""}" style="width:${pct}%"></div></div>
      <div class="w-grid">
        <button data-water="200">+200<br><small style="font-weight:600;color:var(--muted)">ml</small></button>
        <button data-water="330">+330<br><small style="font-weight:600;color:var(--muted)">ml</small></button>
        <button data-water="500">+500<br><small style="font-weight:600;color:var(--muted)">ml</small></button>
      </div>
      <button class="w-undo" data-water="-250">− 250 ml (oprava)</button>
      <div class="sheet-actions">
        <button class="btn primary" id="w-close">Hotovo</button>
      </div>`;
    $sheet.querySelectorAll("[data-water]").forEach(b =>
      b.addEventListener("click", () => {
        const t = todayStr();
        state.water[t] = Math.max(0, (state.water[t] || 0) + (+b.dataset.water));
        save(); render2();
        const btn = document.getElementById("waterBtn");
        if(btn){
          const cur2 = state.water[t] || 0;
          btn.classList.toggle("full", cur2 >= state.settings.waterGoal);
          btn.querySelector(".wfill").style.height = Math.min(100, Math.round(cur2/state.settings.waterGoal*100)) + "%";
        }
      }));
    document.getElementById("w-close").addEventListener("click", closeSheet);
  };
  $overlay.classList.add("show");
  render2();
  requestAnimationFrame(() => $sheet.classList.add("show"));
}
function bindWater(){
  const b = document.getElementById("waterBtn");
  if(b) b.addEventListener("click", openWaterSheet);
}

/* ================= render ================= */
const $header = document.getElementById("header");
const $main = document.getElementById("main");

function render(){
  ensureToday();
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === activeTab));
  if(activeTab === "today") renderToday();
  if(activeTab === "exercises") renderExercises();
  if(activeTab === "plans") renderPlans();
  if(activeTab === "overview") renderOverview();
}

/* ---------- Dnes ---------- */
function renderToday(){
  const d = new Date();
  const {plan, mode, entries, day, dow} = todaysWorkout();

  let total = 0, done = 0;
  for(const en of entries){ total += en.sets; done += progressOf(en); }
  const pct = total ? Math.round(done/total*100) : 0;
  const C = 2 * Math.PI * 25;

  updateCompletedToday(total, done);
  const streak = computeStreak();

  $header.innerHTML = `
    <div class="h-title">
      <span class="h-eyebrow">${DAY_FULL[d.getDay()]} · ${d.getDate()}. ${MONTHS[d.getMonth()]}</span>
      <span class="h-day">Dnešní trénink</span>
    </div>
    <div class="h-right">
      ${syncUser ? `<span id="syncDot" class="syncdot" title="Synchronizace">${syncIcon()}</span>` : ""}
      ${waterBtnHTML()}
      <div class="streak ${streak > 0 ? "hot" : ""}" title="Odcvičené dny v řadě">🔥 ${streak}</div>
      ${total ? `
      <div class="ring">
        <svg width="58" height="58" viewBox="0 0 58 58">
          <circle class="bgc" cx="29" cy="29" r="25"></circle>
          <circle class="fgc" cx="29" cy="29" r="25"
            stroke-dasharray="${C.toFixed(1)}"
            stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"></circle>
        </svg>
        <span>${pct}%</span>
      </div>` : ``}
    </div>
  `;

  /* --- žádný trénink na dnešek --- */
  if(!plan){
    if(state.plans.length === 0){
      $main.innerHTML = `
        <div class="empty">
          <div class="big">🌤️</div>
          <h3>Zatím tu nic není</h3>
          <p>Vytvoř si plán v záložce <b>Plány</b> — cviky už na tebe čekají v záložce <b>Cviky</b>.</p>
        </div>`;
      bindWater();
      return;
    }
    const picker = state.plans.map(p => {
      const daysWith = DAYS_ORDER.filter(dd => entriesOf(p, dd).length);
      const btns = daysWith.length
        ? daysWith.map(dd =>
            `<button class="daybtn ${dd === dow ? "today" : ""}" data-pick="${p.id}" data-day="${dd}">${DAYS[dd]}${dd === dow ? " · dnes" : ""}</button>`).join("")
        : `<span class="hint">žádné cviky v plánu</span>`;
      return `
        <div class="pick-plan">
          <div class="pick-plan-name">${esc(p.name)}</div>
          <div class="pick-days-row">${btns}</div>
        </div>`;
    }).join("");

    $main.innerHTML = `
      <div class="empty" style="padding-bottom:20px">
        <div class="big">${mode === "rest" ? "🌤️" : "🗓️"}</div>
        <h3>${mode === "rest" ? "Dnes máš podle plánu volno" : "Žádný aktivní plán"}</h3>
        <p>${mode === "rest"
          ? "Aktivní plán dnes nic nepředepisuje. Chceš přesto cvičit? Vyber si plán a den ručně."
          : "Nastav si aktivní plán v záložce <b>Plány</b>, nebo si vyber dnešní trénink ručně."}</p>
      </div>
      <div class="plan-label">Vybrat trénink na dnešek</div>
      ${picker}`;

    bindWater();
    $main.querySelectorAll("[data-pick]").forEach(b =>
      b.addEventListener("click", () => {
        state.daily.manualPlanId = b.dataset.pick;
        state.daily.manualDay = +b.dataset.day;
        save(); render();
        toast("Trénink vybrán na dnešek");
      }));
    return;
  }

  /* --- trénink --- */
  let html = "";
  if(total > 0 && done === total){
    html += `
      <div class="finish-banner">
        <div class="big">🏆</div>
        <h3>Hotovo!</h3>
        <p>Všech ${total} sérií odcvičeno. ${streak > 1 ? `To je už ${streak}. den v řadě! 🔥` : "Skvělá práce."}</p>
      </div>`;
  }

  html += `
    <div class="plan-head">
      <span class="plan-label" style="padding:0">${esc(plan.name)}${mode === "manual" ? ` · ${DAY_FULL[day]}${day !== dow ? " (ručně)" : ""}` : ""}</span>
      ${mode === "manual" ? `<button class="link-btn" id="clearManual">Zrušit výběr</button>` : ""}
    </div>`;

  for(const en of entries){
    const ex = exById(en.exId);
    const arr = state.daily.progress[en.exId] || [];
    const doneN = progressOf(en);
    const finished = doneN === en.sets;
    const sub = [
      en.weight != null && en.weight !== "" ? `🏋️ ${en.weight} kg` : "",
      en.reps ? `${esc(en.reps)} opak.` : ""
    ].filter(Boolean).join(" · ");
    const last = lastSessionFor(en.exId);
    let circles = "";
    for(let i=0;i<en.sets;i++){
      const lg = setLogOf(en.exId, i);
      const custom = lg && (lg.w !== en.weight || (lg.r || "") !== (en.reps || ""));
      circles += `<button class="set ${arr[i] ? "on":""} ${custom ? "custom":""}" data-ex="${en.exId}" data-i="${i}"><span>${i+1}</span></button>`;
    }
    html += `
      <div class="card ${finished ? "done-card":""}">
        <div class="ex-top">
          <div class="ex-name">${esc(ex.name)}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="ex-count"><b>${doneN}</b> / ${en.sets}</div>
            <button class="icon-btn sm" data-editen="${en.exId}" aria-label="Upravit série, váhu a opakování">✏️</button>
          </div>
        </div>
        ${sub ? `<div class="ex-note">${sub}</div>` : ""}
        ${last ? `<div class="last-line">↩︎ minule ${fmtShort(last.date)}: ${summarizeSets(last.sets)}</div>` : ""}
        <div class="sets">${circles}</div>
      </div>`;
  }

  $main.innerHTML = html;
  bindWater();

  const clr = document.getElementById("clearManual");
  if(clr) clr.addEventListener("click", () => {
    state.daily.manualPlanId = null;
    state.daily.manualDay = null;
    save(); render();
  });

  $main.querySelectorAll("[data-editen]").forEach(b =>
    b.addEventListener("click", () => openEntrySheet(plan, day, b.dataset.editen)));

  /* krátké ťuknutí = odškrtnout, podržení = zapsat skutečnou váhu a opakování */
  let lpTimer = null, lpFired = false;
  const cancelLP = () => { clearTimeout(lpTimer); lpTimer = null; };
  $main.querySelectorAll(".set").forEach(btn => {
    const id = btn.dataset.ex, i = +btn.dataset.i;
    const startLP = () => {
      lpFired = false;
      lpTimer = setTimeout(() => {
        lpFired = true;
        if(navigator.vibrate) navigator.vibrate(25);
        openSetSheet(plan, day, id, i);
      }, 480);
    };
    btn.addEventListener("touchstart", startLP, { passive: true });
    btn.addEventListener("touchend", cancelLP);
    btn.addEventListener("touchmove", cancelLP);
    btn.addEventListener("touchcancel", cancelLP);
    btn.addEventListener("mousedown", startLP);
    btn.addEventListener("mouseup", cancelLP);
    btn.addEventListener("mouseleave", cancelLP);
    btn.addEventListener("contextmenu", e => e.preventDefault());
    btn.addEventListener("click", () => {
      cancelLP();
      if(lpFired){ lpFired = false; return; }
      toggleSet(plan, day, entries, id, i, null);
    });
  });
}


/* ---------- odškrtnutí série + zápis do deníku ---------- */
function toggleSet(plan, day, entries, exId, i, custom){
  const en = entries.find(e => e.exId === exId);
  if(!en) return;
  const arr = state.daily.progress[exId] || (state.daily.progress[exId] = []);
  if(custom) arr[i] = true; else arr[i] = !arr[i];

  recordSet(plan, day, en, i, arr[i], custom);

  if(arr[i]){
    /* nejtěžší dnešní váha cviku do historie pro graf progresu */
    const w = custom && custom.w != null ? custom.w : en.weight;
    if(w != null){
      const t = todayStr();
      if(!state.history[t]) state.history[t] = {};
      state.history[t][exId] = Math.max(state.history[t][exId] || 0, w);
    }
    /* odpočinkový timer — nespouští se po poslední sérii tréninku */
    let tot = 0, dn = 0;
    for(const e2 of entries){ tot += e2.sets; dn += progressOf(e2); }
    if(dn < tot) startRest(plan.restTimer != null ? plan.restTimer : state.settings.restTimer);
    else stopRest();
  }
  save();
  render();
}

/* ---------- zápis konkrétní série (podržení kolečka) ---------- */
function openSetSheet(plan, day, exId, i){
  const {entries} = todaysWorkout();
  const en = entries.find(e => e.exId === exId);
  const ex = exById(exId);
  if(!en || !ex) return;
  const cur = setLogOf(exId, i);
  const w = cur && cur.w != null ? cur.w : (en.weight != null ? en.weight : "");
  const r = cur && cur.r ? cur.r : (en.reps || "");

  openSheet(`
    <h3 style="margin-bottom:6px">${esc(ex.name)}</h3>
    <p class="hint" style="margin:0 0 18px">${i+1}. série ze ${en.sets} — zapiš, co jsi opravdu zvedl</p>
    <div class="set-row" style="gap:10px">
      <div class="mini-in" style="flex:1">
        <label>Váha kg</label>
        <input id="ss-w" type="text" inputmode="decimal" style="width:100%" value="${w}" placeholder="—" maxlength="7">
      </div>
      <div class="mini-in" style="flex:1">
        <label>Opakování</label>
        <input id="ss-r" type="text" inputmode="numeric" style="width:100%" value="${esc(r)}" placeholder="—" maxlength="20">
      </div>
    </div>
    <div class="sheet-actions">
      ${cur ? `<button class="btn ghost" id="ss-clear">Odškrtnout zpět</button>` : `<button class="btn ghost" id="ss-cancel">Zrušit</button>`}
      <button class="btn primary" id="ss-save">Uložit sérii</button>
    </div>
  `);

  const cancelBtn = document.getElementById("ss-cancel");
  if(cancelBtn) cancelBtn.addEventListener("click", closeSheet);
  const clearBtn = document.getElementById("ss-clear");
  if(clearBtn) clearBtn.addEventListener("click", () => {
    state.daily.progress[exId][i] = false;
    recordSet(plan, day, en, i, false);
    save(); closeSheet(); render();
  });
  document.getElementById("ss-save").addEventListener("click", () => {
    const raw = document.getElementById("ss-w").value.trim().replace(",", ".");
    const val = raw === "" ? null : (isNaN(parseFloat(raw)) ? null : parseFloat(raw));
    const reps = document.getElementById("ss-r").value.trim();
    closeSheet();
    toggleSet(plan, day, entries, exId, i, { w: val, r: reps });
  });
}

/* ---------- Cviky ---------- */

    html += `<div class="grp-h">${g}</div><div class="grp-card">`;
    for(const ex of exs){
      html += `
        <div class="exr">
          <span>${esc(ex.name)}</span>

function deleteExercise(id){
  const ex = exById(id);
  if(!ex) return;
  if(!confirm(`Smazat cvik „${ex.name}"? Odebere se i ze všech plánů.`)) return;
  state.exercises = state.exercises.filter(e=>e.id!==id);
  state.deleted[id] = Date.now();

    if(p.schedule){
      for(const d in p.schedule) p.schedule[d] = p.schedule[d].filter(en => en.exId !== id);
      touch(p);

function chartData(exId){

function chartSVG(pts){
  if(pts.length === 0) return "";
  const W = 320, H = 150, P = 26;
  const ws = pts.map(p => p.w);
  let min = Math.min(...ws), max = Math.max(...ws);
  if(min === max){ min -= 1; max += 1; }
  const x = i => pts.length === 1 ? W/2 : P + (W-2*P) * i / (pts.length-1);
  const y = w => H - P - (H-2*P) * (w - min) / (max - min);
  const line = pts.map((p,i) => `${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join(" ");
  const dots = pts.map((p,i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="4" fill="#3DDC97"/>`).join("");
  const fmt = ds => { const p = ds.split("-"); return +p[2]+"."+(+p[1])+"."; };
  const last = pts[pts.length-1];
  return `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${pts.length > 1 ? `<polyline points="${line}" fill="none" stroke="#3DDC97" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${dots}
      <text x="${P}" y="14" font-size="11" font-weight="700" fill="#8B93A5">max ${Math.max(...ws)} kg</text>
      <text x="${P}" y="${H-6}" font-size="11" font-weight="700" fill="#8B93A5">${fmt(pts[0].ds)}</text>
      <text x="${W-P}" y="${H-6}" font-size="11" font-weight="700" fill="#8B93A5" text-anchor="end">${fmt(last.ds)} · ${last.w} kg</text>
    </svg>`;
}

/* ---------- sloupcové grafy ---------- */
let statView = null;
const fmtDate = ds => { const p = ds.split("-"); return (+p[2])+". "+(+p[1])+". "+p[0]; };

function weekBars(){
  const done = new Set(state.completedDays);
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(today);
  d.setDate(today.getDate() - ((today.getDay()+6)%7) - 7*7);
  const bars = [];
  for(let w=0; w<8; w++){
    const label = d.getDate()+"."+(d.getMonth()+1)+".";
    let n = 0;
    for(let i=0;i<7;i++){ if(done.has(dateStr(d))) n++; d.setDate(d.getDate()+1); }
    bars.push({ label, v: n });
  }
  return bars;
}
function waterBars(){
  const bars = [];
  const d = new Date(); d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){
    bars.push({ label: d.getDate()+"."+(d.getMonth()+1)+".", v: state.water[dateStr(d)] || 0 });
    d.setDate(d.getDate()+1);
  }
  return bars;
}
function barSVG(bars, opts = {}){
  const W = 320, H = 150, P = 26;
  const m = Math.max(opts.max || 0, opts.goal || 0, ...bars.map(b=>b.v), 1);
  const iw = (W - 2*P) / bars.length;
  const bw = iw * 0.62;
  const y = v => H - P - (H - 2*P - 16) * v / m;
  let rects = "", labels = "";
  bars.forEach((b, i) => {
    const x = P + iw*i + (iw-bw)/2;
    const yy = y(b.v);
    const fill = opts.goal != null ? (b.v >= opts.goal ? "#3DDC97" : "#FF7A3D") : "#3DDC97";
    if(b.v > 0){
      rects += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-P-yy).toFixed(1)}" rx="3" fill="${fill}"/>`;
      if(bars.length <= 8)
        labels += `<text x="${(x+bw/2).toFixed(1)}" y="${(yy-4).toFixed(1)}" font-size="10" font-weight="700" fill="#8B93A5" text-anchor="middle">${opts.fmt ? opts.fmt(b.v) : b.v}</text>`;
    }else{
      rects += `<rect x="${x.toFixed(1)}" y="${H-P-2}" width="${bw.toFixed(1)}" height="2" rx="1" fill="#2B3342"/>`;
    }
  });
  let goalLine = "";
  if(opts.goal != null){
    const gy = y(opts.goal);
    goalLine = `<line x1="${P}" x2="${W-P}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="#8B93A5" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  return `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${rects}${goalLine}${labels}
      <text x="${P}" y="${H-6}" font-size="11" font-weight="700" fill="#8B93A5">${bars[0].label}</text>
      <text x="${W-P}" y="${H-6}" font-size="11" font-weight="700" fill="#8B93A5" text-anchor="end">${bars[bars.length-1].label}</text>
    </svg>`;
}


function volumeBars(){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(today);
  d.setDate(today.getDate() - ((today.getDay()+6)%7) - 7*7);
  const bars = [];
  for(let w=0; w<8; w++){
    const label = d.getDate()+"."+(d.getMonth()+1)+".";
    let v = 0;
    for(let i=0;i<7;i++){
      const s = state.sessions[dateStr(d)];
      if(s) v += sessionVolume(s);
      d.setDate(d.getDate()+1);
    }
    bars.push({ label, v: Math.round(v) });
  }
  return bars;
}
function rmSeries(exId){
  const pts = [];
  for(const ds of Object.keys(state.sessions).sort()){
    const rec = state.sessions[ds].ex[exId];
    if(!rec) continue;
    const v = best1RM(rec.sets.filter(Boolean));
    if(v > 0) pts.push({ ds, w: Math.round(v*10)/10 });
  }
  return pts;
}
function groupDistribution(days){
  const since = new Date(); since.setDate(since.getDate() - days);
  const sinceS = dateStr(since);
  const counts = {};
  for(const ds of Object.keys(state.sessions)){
    if(ds < sinceS) continue;
    const s = state.sessions[ds];
    for(const id in s.ex){
      const ex = exById(id);
      const g = ex ? (ex.group || "Ostatní") : "Ostatní";
      counts[g] = (counts[g] || 0) + s.ex[id].sets.filter(Boolean).length;
    }
  }
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}
function distHTML(rows){
  if(!rows.length) return `<p class="hint" style="margin:0">Zatím žádné odcvičené série za posledních 30 dní.</p>`;

  return rows.map(([g,n]) => `
    <div class="dist-row">
      <span class="dn">${g}</span>
      <span class="db"><i style="width:${Math.round(n/max*100)}%"></i></span>
      <span class="dv">${n}</span>
    </div>`).join("") + `<p class="hint">Počet odcvičených sérií podle partie za posledních 30 dní.</p>`;
}
function openSessionSheet(ds){

}

        c.includes("too-many-requests")    ? "Příliš mnoho pokusů, zkus to za chvíli." :

        "Chyba: " + c;
      setSyncStatus("out");
      render();

  };
  const syIn = document.getElementById("sy-in");

  const syReg = document.getElementById("sy-reg");
  if(syReg) syReg.addEventListener("click", () => doAuth("reg"));

    authBusy = true;

    const res = await window.__fb.test(mail, pass);

    syncError = (res.ok ? "✅ " : "⚠️ ") + res.msg +
      (res.ok ? " Problém je tedy v úložišti prohlížeče, ne ve Firebase." : "");
    render();
  });

  const inst = document.getElementById("do-install");
  if(inst) inst.addEventListener("click", doInstall);

  const exp = document.getElementById("do-export");

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "trenink-zaloha-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  state.lastBackup = todayStr(); save();
  toast("Záloha stažena");
}
document.getElementById("import-file").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.exercises) || !Array.isArray(parsed.plans)){
        toast("Tohle nevypadá jako záloha aplikace"); return;
      }
      if(!confirm("Načíst zálohu? Nahradí všechna aktuální data v aplikaci.")) return;
      localStorage.setItem(KEY, reader.result);
      state = load();
      render();
      toast("Záloha načtena");
    }catch(err){ toast("Soubor se nepodařilo přečíst"); }
  };
  reader.readAsText(file);
});

/* ---------- odpočinkový timer ---------- */
let restInt = null, restEnd = 0, restTotal = 0, wakeLock = null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }else if(!on && wakeLock){
      await wakeLock.release(); wakeLock = null;
    }
  }catch(e){ wakeLock = null; }
}
function startRest(dur){
  if(!dur){ stopRest(); return; }
  restTotal = dur;
  restEnd = Date.now() + dur * 1000;
  document.getElementById("restbar").classList.add("show");
  clearInterval(restInt);
  keepAwake(true);
  tickRest();
  restInt = setInterval(tickRest, 250);
}
function stopRest(){
  clearInterval(restInt); restInt = null;
  document.getElementById("restbar").classList.remove("show");
  keepAwake(false);
}
function tickRest(){
  const left = Math.max(0, restEnd - Date.now());
  const s = Math.ceil(left / 1000);
  document.getElementById("rest-time").textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  document.getElementById("rest-fill").style.width = (100 * (1 - left / (restTotal * 1000))) + "%";
  if(left <= 0){ stopRest(); buzz(); toast("Pauza skončila — jedeme dál! 💪"); }
}
function buzz(){
  if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(ctx.currentTime + 0.35);
    setTimeout(() => ctx.close(), 600);
  }catch(e){}
}
document.getElementById("rest-skip").addEventListener("click", stopRest);

/* --- plán: týden po dnech, v každém dni cviky se sériemi, váhou a opakováními --- */
function openPlanSheet(id){
  const plan = id ? state.plans.find(p=>p.id===id) : null;
  const schedule = {};
  for(const d of DAYS_ORDER){
    schedule[d] = plan && plan.schedule && plan.schedule[d]
      ? plan.schedule[d].map(en => ({...en}))
      : [];
  }
  let openDay = null;
  let pickingDay = null; // den, ve kterém je otevřený výběr cviku
  let pickText = "";     // text ve vyhledávání / vlastním cviku
  let pickGroup = "Ostatní"; // partie pro nově vytvářený cvik
  let restT = plan && plan.restTimer != null ? plan.restTimer : state.settings.restTimer;
  const fmtT = s => s ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : "Vyp.";

  function entryRow(d, en){
    const ex = exById(en.exId);
    if(!ex) return "";
    return `
      <div class="entry" data-day="${d}" data-ex="${en.exId}">
        <div class="entry-top">
          <span>${esc(ex.name)}</span>
          <div style="display:flex;align-items:center;gap:2px;flex:none">
            <button class="icon-btn sm" data-up data-day="${d}" data-ex="${en.exId}" aria-label="Posunout nahoru">▲</button>
            <button class="icon-btn sm" data-down data-day="${d}" data-ex="${en.exId}" aria-label="Posunout dolů">▼</button>
            <button class="entry-rm" data-rm data-day="${d}" data-ex="${en.exId}" aria-label="Odebrat cvik">✕</button>
          </div>
        </div>
        <div class="entry-ctrl">
          <div class="mini-step">
            <button data-dec data-day="${d}" data-ex="${en.exId}">−</button>
            <b>${en.sets}<small>sérií</small></b>
            <button data-inc data-day="${d}" data-ex="${en.exId}">＋</button>
          </div>
          <div class="mini-in">
            <label>Váha kg</label>
            <input type="text" inputmode="decimal" data-w data-day="${d}" data-ex="${en.exId}" value="${en.weight != null ? en.weight : ""}" maxlength="7" placeholder="—">
          </div>
          <div class="mini-in">
            <label>Opak.</label>
            <input type="text" data-r data-day="${d}" data-ex="${en.exId}" value="${en.reps ? esc(en.reps) : ""}" maxlength="20" placeholder="—">
          </div>
        </div>
      </div>`;
  }

  function pickerListHTML(d){
    const usedIds = new Set(schedule[d].map(en => en.exId));
    const q = pickText.trim().toLowerCase();
    let html = "";

    /* vlastní cvik — vytvoří se a rovnou přidá do dne */
    if(q){
      const exact = state.exercises.some(e => e.name.toLowerCase() === q);
      if(!exact){
        html += `
          <button class="create-opt" data-create data-day="${d}">
            <span>＋ Vytvořit „${esc(pickText.trim())}" v partii ${pickGroup}</span>
          </button>
          <div class="grp-pick" style="margin:8px 0 2px">${GROUPS.map(g =>
            `<button data-pgrp="${g}" class="${g === pickGroup ? "on" : ""}">${g}</button>`).join("")}</div>`;
      }
    }

    for(const g of GROUPS){
      const exs = state.exercises.filter(e =>
        (e.group || "Ostatní") === g &&
        !usedIds.has(e.id) &&
        (!q || e.name.toLowerCase().includes(q)));
      if(!exs.length) continue;
      html += `<div class="grp-h">${g}</div><div class="pick-ex">` +
        exs.map(e => `
          <button class="opt" data-add data-day="${d}" data-ex="${e.id}">
            <span>${esc(e.name)}</span>
            <span class="mark">＋</span>
          </button>`).join("") + `</div>`;
    }
    if(!html) html = `<p class="hint" style="margin:4px 0 10px">${q ? "Nic nenalezeno — vytvoř si vlastní cvik tlačítkem výše." : "Všechny cviky už v tomto dni jsou."}</p>`;
    return html;
  }

  function pickerFor(d){
    return `
      <div class="pick-search">
        <input type="text" data-search="${d}" placeholder="Hledat nebo napsat vlastní cvik…" value="${esc(pickText)}" maxlength="60">
      </div>
      <div data-list="${d}">${pickerListHTML(d)}</div>`;
  }

  function dayRows(){
    return DAYS_ORDER.map(d => {
      const n = schedule[d].filter(en => exById(en.exId)).length;
      const open = openDay === d;
      let inner = "";
      if(open){
        inner = schedule[d].map(en => entryRow(d, en)).join("");
        if(pickingDay === d){
          inner += pickerFor(d);
          inner += `<button class="add-ex-day" data-closepick="${d}">Hotovo</button>`;
        }else{
          inner += `<button class="add-ex-day" data-openpick="${d}">＋ Přidat cvik</button>`;
        }
      }
      return `
        <div class="day-block ${open?"open":""}">
          <button class="day-row" data-toggle="${d}">
            <span>${DAY_FULL[d]}</span>
            <span class="day-meta ${n?"has":""}">${n ? n+" "+plural(n,"cvik","cviky","cviků") : "volno"} ${open?"▴":"▾"}</span>
          </button>
          ${inner}
        </div>`;
    }).join("");
  }

  openSheet(`
    <h3>${plan ? "Upravit plán" : "Nový plán"}</h3>
    <div class="field">
      <label>Název plánu</label>
      <input type="text" id="p-name" placeholder="např. Objemový týden" value="${plan ? esc(plan.name) : ""}" maxlength="60">
    </div>
    <div class="field">
      <label>⏱️ Pauza mezi sériemi</label>
      <div class="mini-step" style="width:max-content">
        <button id="pt-dec">−</button>
        <b style="min-width:64px" id="pt-val">${fmtT(restT)}</b>
        <button id="pt-inc">＋</button>
      </div>
      <p class="hint">Platí pro tento plán. 0 = bez odpočtu.</p>
    </div>
    <div class="field">
      <label>Týden</label>
      <div id="p-week">${dayRows()}</div>
      <p class="hint">Rozklikni den, přidej cviky a u každého nastav série, váhu a opakování. Den bez cviků zůstane jako volno.</p>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="p-cancel">Zrušit</button>
      <button class="btn primary" id="p-save">Uložit</button>
    </div>
  `);

  const $week = document.getElementById("p-week");
  function findEntry(d, exId){ return schedule[d].find(en => en.exId === exId); }
  function rerender(){ $week.innerHTML = dayRows(); bind(); }

  function addToDay(d, exId){
    schedule[d].push({ exId, sets: 3, weight: null, reps: "" });
    pickText = "";
    rerender();
  }

  function bindList(scope){
    scope.querySelectorAll("[data-pgrp]").forEach(b =>
      b.addEventListener("click", () => {
        pickGroup = b.dataset.pgrp;
        const d = pickingDay;
        const list = $week.querySelector(`[data-list="${d}"]`);
        if(list){ list.innerHTML = pickerListHTML(d); bindList(list); }
      }));
    scope.querySelectorAll("[data-add]").forEach(b =>
      b.addEventListener("click", () => addToDay(+b.dataset.day, b.dataset.ex)));
    scope.querySelectorAll("[data-create]").forEach(b =>
      b.addEventListener("click", () => {
        const name = pickText.trim();
        if(!name) return;
        const ex = touch({ id: uid(), name, group: pickGroup });
        state.exercises.push(ex);
        save();
        toast(`Cvik „${name}" vytvořen`);
        addToDay(+b.dataset.day, ex.id);
      }));
  }

  function bind(){
    $week.querySelectorAll("[data-toggle]").forEach(b =>
      b.addEventListener("click", () => {
        const d = +b.dataset.toggle;
        openDay = openDay === d ? null : d;
        pickingDay = null; pickText = "";
        rerender();
      }));
    $week.querySelectorAll("[data-openpick]").forEach(b =>
      b.addEventListener("click", () => { pickingDay = +b.dataset.openpick; pickText = ""; rerender(); }));
    $week.querySelectorAll("[data-closepick]").forEach(b =>
      b.addEventListener("click", () => { pickingDay = null; pickText = ""; rerender(); }));
    /* psaní filtruje seznam bez překreslení pole, aby neztrácelo fokus */
    $week.querySelectorAll("[data-search]").forEach(inp =>
      inp.addEventListener("input", () => {
        pickText = inp.value;
        const d = inp.dataset.search;
        const list = $week.querySelector(`[data-list="${d}"]`);
        if(list){ list.innerHTML = pickerListHTML(+d); bindList(list); }
      }));
    bindList($week);
    $week.querySelectorAll("[data-rm]").forEach(b =>
      b.addEventListener("click", () => {
        const d = +b.dataset.day;
        schedule[d] = schedule[d].filter(en => en.exId !== b.dataset.ex);
        rerender();
      }));
    const move = (d, exId, dir) => {
      const list = schedule[d];
      const i = list.findIndex(en => en.exId === exId);
      const j = i + dir;
      if(i < 0 || j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      rerender();
    };
    $week.querySelectorAll("[data-up]").forEach(b =>
      b.addEventListener("click", () => move(+b.dataset.day, b.dataset.ex, -1)));
    $week.querySelectorAll("[data-down]").forEach(b =>
      b.addEventListener("click", () => move(+b.dataset.day, b.dataset.ex, 1)));
    $week.querySelectorAll("[data-dec]").forEach(b =>
      b.addEventListener("click", () => {
        const en = findEntry(+b.dataset.day, b.dataset.ex);
        if(en && en.sets > 1){ en.sets--; rerender(); }
      }));
    $week.querySelectorAll("[data-inc]").forEach(b =>
      b.addEventListener("click", () => {
        const en = findEntry(+b.dataset.day, b.dataset.ex);
        if(en && en.sets < 20){ en.sets++; rerender(); }
      }));
    /* váha a opakování se ukládají průběžně bez překreslení, aby psaní neztrácelo fokus */
    $week.querySelectorAll("[data-w]").forEach(inp =>
      inp.addEventListener("input", () => {
        const en = findEntry(+inp.dataset.day, inp.dataset.ex);
        if(!en) return;
        const w = inp.value.trim().replace(",", ".");
        en.weight = w !== "" && !isNaN(parseFloat(w)) ? parseFloat(w) : null;
      }));
    $week.querySelectorAll("[data-r]").forEach(inp =>
      inp.addEventListener("input", () => {
        const en = findEntry(+inp.dataset.day, inp.dataset.ex);
        if(en) en.reps = inp.value.trim();
      }));
  }
  bind();

  document.getElementById("pt-dec").addEventListener("click", () => {
    restT = Math.max(0, restT - 15);
    document.getElementById("pt-val").textContent = fmtT(restT);
  });
  document.getElementById("pt-inc").addEventListener("click", () => {
    restT = Math.min(300, restT + 15);
    document.getElementById("pt-val").textContent = fmtT(restT);
  });

  document.getElementById("p-cancel").addEventListener("click", closeSheet);
  document.getElementById("p-save").addEventListener("click", ()=>{
    const name = document.getElementById("p-name").value.trim();
    if(!name){ toast("Zadej název plánu"); return; }
    const hasAny = DAYS_ORDER.some(d => schedule[d].some(en => exById(en.exId)));
    if(!hasAny){ toast("Přidej cviky aspoň do jednoho dne"); return; }
    const clean = {};
    for(const d of DAYS_ORDER){
      const valid = schedule[d].filter(en => exById(en.exId));
      if(valid.length) clean[d] = valid;
    }
    if(plan){
      plan.name = name; plan.schedule = clean; plan.restTimer = restT; touch(plan);
      toast("Plán upraven");
    }else{
      state.plans.push(touch({ id: uid(), name, schedule: clean, restTimer: restT }));
      toast("Plán vytvořen");
    }
    save(); closeSheet(); render();
  });
}

/* ================= toast & nav ================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", ()=>{ activeTab = t.dataset.tab; exSearch = ""; render(); }));

document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden){ if(restInt) keepAwake(true); render(); }
});


/* ================= synchronizace (Firebase) ================= */
var syncApplying = false;          // právě zapisujeme data z cloudu → nepushovat zpět
var syncError = "";                // poslední chyba, ať je vidět natrvalo
var syncSdk = "loading";           // loading | ready | failed
var authBusy = false;              // probíhá přihlášení → nepřekreslovat formulář
var syncStatus = "off";            // off | setup | out | connecting | ok | pending | error
var syncUser = null;
var pushTimer = null;
const fbReady = () => !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);

function schedulePush(){
  if(!window.__fb || !syncUser) return;
  clearTimeout(pushTimer);
  setSyncStatus("pending");
  pushTimer = setTimeout(() => window.__fb.push(), 900);
}
function setSyncStatus(s){
  if(syncStatus === s) return;
  syncStatus = s;
  const el = document.getElementById("syncDot");
  if(el) el.textContent = syncIcon();
  if(!authBusy && activeTab === "overview" && statView === "cloud") render();
}
function syncIcon(){
  return { ok:"☁️", pending:"⟳", connecting:"⟳", error:"⚠️", out:"", off:"", setup:"" }[syncStatus] || "";
}
function syncLabel(){
  return {
    off:"Vypnuto — chybí nastavení",
    setup:"Chybí nastavení Firebase",
    out:"Nepřihlášen",
    connecting:"Připojuji…",
    ok:"Synchronizováno",
    pending:"Ukládám…",
    error:"Chyba spojení"
  }[syncStatus] || "";
}

/* --- sloučení místních a cloudových dat --- */
function mergeState(local, remote){
  const lu = local.updatedAt || 0, ru = remote.updatedAt || 0;
  const remoteNewer = ru > lu;
  const out = JSON.parse(JSON.stringify(local));
  const t = todayStr();

  /* náhrobky smazaných položek, ať se nevrací zpátky */
  const del = Object.assign({}, remote.deleted || {});
  for(const id in (local.deleted || {})) del[id] = Math.max(del[id] || 0, local.deleted[id]);
  out.deleted = del;

  /* cviky a plány — vyhrává novější verze položky */
  const mergeList = (a, b) => {
    const map = new Map();
    for(const it of (a || [])) map.set(it.id, it);
    for(const it of (b || [])){
      const cur = map.get(it.id);
      if(!cur || (it.upd || 0) > (cur.upd || 0)) map.set(it.id, it);
    }
    for(const id in del){
      const it = map.get(id);
      if(it && (it.upd || 0) <= del[id]) map.delete(id);
    }
    return [...map.values()];
  };
  out.exercises = mergeList(local.exercises, remote.exercises);
  out.plans = mergeList(local.plans, remote.plans);

  /* data vedená podle data — slučují se záznam po záznamu,
     jen u dnešního dne rozhoduje, kdo zapisoval později */
  for(const k of ["sessions","water","bodyWeight","history"]){
    const base = remoteNewer ? local[k] : remote[k];
    const top  = remoteNewer ? remote[k] : local[k];
    out[k] = Object.assign({}, base || {}, top || {});
  }

  /* odcvičené dny — sjednocení, dnešek podle novějšího zápisu */
  const days = new Set([...(local.completedDays || []), ...(remote.completedDays || [])]);
  days.delete(t);
  const src = remoteNewer ? remote : local;
  if((src.completedDays || []).includes(t)) days.add(t);
  out.completedDays = [...days].sort();

  /* dnešní odškrtané série */
  const rd = remote.daily, ld = local.daily;
  if(rd && ld && rd.date === ld.date && remoteNewer) out.daily = rd;

  if(remoteNewer){
    if(remote.settings) out.settings = remote.settings;
    if(remote.activePlanId !== undefined) out.activePlanId = remote.activePlanId;
    if(remote.lastBackup) out.lastBackup = remote.lastBackup;
  }
  out.updatedAt = Math.max(lu, ru);
  return out;
}

/* volá se z modulu níže, když dorazí data z cloudu */
function applyRemote(remote){
  if(!remote) return;
  const merged = mergeState(state, remote);
  syncApplying = true;
  state = merged;
  save();
  syncApplying = false;
  render();
  /* pokud jsme po sloučení napřed, pošli výsledek zpátky */
  if((state.updatedAt || 0) > (remote.updatedAt || 0)) schedulePush();
  else setSyncStatus("ok");
}

/* ================= instalace na plochu (PWA) ================= */
let installPrompt = null;

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  if(activeTab === "overview") render();
  else toast("📲 Aplikaci lze přidat na plochu — viz Přehled");
});

window.addEventListener("appinstalled", () => {
  installPrompt = null;
  toast("Hotovo! Appku máš na ploše 🎉");
  if(activeTab === "overview") render();
});

async function doInstall(){
  if(!installPrompt) return;
  installPrompt.prompt();
  try{ await installPrompt.userChoice; }catch(e){}
  installPrompt = null;
  render();
}
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

render();
</script>

<script type="module">
/* ===== Firebase: přihlášení + synchronizace přes Firestore ===== */
if(!fbReady()){
  setSyncStatus("setup");
}else{
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence,
            browserSessionPersistence, inMemoryPersistence,
            onAuthStateChanged, signInWithEmailAndPassword,
            createUserWithEmailAndPassword, signOut, sendPasswordResetEmail }
      = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const { initializeFirestore, persistentLocalCache, memoryLocalCache, doc, onSnapshot, setDoc }
      = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

    syncSdk = "ready";
    const app = initializeApp(FIREBASE_CONFIG);

    /* Na Androidu se IndexedDB v nainstalované appce občas zasekne.
       Dáme Firebase seznam úložišť — použije první, které funguje. */
    const auth = initializeAuth(app, {
      persistence: [indexedDBLocalPersistence, browserLocalPersistence,
                    browserSessionPersistence, inMemoryPersistence]
    });

    /* Trvalá offline cache může kolidovat, když je appka otevřená
       na ploše i v záložce zároveň — pak spadneme na paměťovou. */
    let db;
    try{
      db = initializeFirestore(app, { localCache: persistentLocalCache({}) });
    }catch(e){
      db = initializeFirestore(app, { localCache: memoryLocalCache() });
    }

    let unsub = null, ref = null;

    window.__fb = {
      async push(){
        if(!ref) return;
        try{
          const payload = JSON.parse(JSON.stringify(state));
          delete payload.seeded;
          await setDoc(ref, payload);
          setSyncStatus("ok");
        }catch(e){ setSyncStatus("error"); }
      },
      async login(email, pass){
        setSyncStatus("connecting");
        await signInWithEmailAndPassword(auth, email, pass);
      },
      async register(email, pass){
        setSyncStatus("connecting");
        await createUserWithEmailAndPassword(auth, email, pass);
      },
      async reset(email){ await sendPasswordResetEmail(auth, email); },
      async test(email, pass){
        const url = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="
                  + encodeURIComponent(FIREBASE_CONFIG.apiKey);
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 15000);
        try{
          const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password: pass, returnSecureToken: true }),
            signal: ctrl.signal
          });
          clearTimeout(to);
          const j = await r.json();
          if(r.ok) return { ok:true, msg:"Spojení i účet jsou v pořádku (odpověď " + r.status + ")." };
          return { ok:false, msg:"Google odpověděl: " + ((j.error && j.error.message) || r.status) };
        }catch(e){
          clearTimeout(to);
          return { ok:false, msg:"Síť neodpověděla: " + (e && e.name === "AbortError" ? "vypršel limit 15 s" : (e && e.message || e)) };
        }
      },
      async logout(){
        if(unsub){ unsub(); unsub = null; }
        ref = null;
        await signOut(auth);
      }
    };

    onAuthStateChanged(auth, user => {
      syncUser = user;
      if(unsub){ unsub(); unsub = null; }
      if(!user){ ref = null; setSyncStatus("out"); render(); return; }

      setSyncStatus("connecting");
      ref = doc(db, "users", user.uid);
      unsub = onSnapshot(ref, snap => {
        if(snap.exists()) applyRemote(snap.data());
        else window.__fb.push();          // první přihlášení → nahraj, co máš
      }, () => setSyncStatus("error"));
      render();
    });
  }catch(e){
    syncSdk = "failed";
    syncError = "Nepodařilo se načíst Firebase: " + (e && e.message ? e.message : e);
    setSyncStatus("error");
    render();
  }
}
</script>
